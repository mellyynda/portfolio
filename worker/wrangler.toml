name = "portfolio-theme"
main = "src/index.ts"
compatibility_date = "2026-11-01"
compatibility_flags = ["nodejs_compat"]

# Secrets (never commit): wrangler secret put ANTHROPIC_API_KEY
[vars]
MODEL = "claude-haiku-5-5"
ALLOWED_ORIGINS = "https://mellyynda.github.io"
HOURLY_LIMIT_PER_IP = "5"
DAILY_LIMIT_GLOBAL = "300"

# Burst limit per IP (Cloudflare rate-limiting binding, free; period must be 10 or 60 seconds).
[[ratelimits]]
name = "BURST_LIMITER"
namespace_id = "1001"
simple = { limit = 3, period = 60 }

# Hourly per-IP and daily global counters. No id needed: `wrangler deploy` creates the namespace on first deploy.
[[kv_namespaces]]
binding = "RATE_KV"

[observability]
enabled = true
